name: monitor

on:
  schedule:
    # Daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  monitor:
    name: daily monitor
    # Local Langfuse (localhost:3000) is only reachable from your machine.
    runs-on: self-hosted
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || secrets.LANGFUSE_HOST }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Verify Langfuse and judge env
        run: |
          missing=""
          test -n "${LANGFUSE_PUBLIC_KEY}" || missing="${missing} LANGFUSE_PUBLIC_KEY"
          test -n "${LANGFUSE_SECRET_KEY}" || missing="${missing} LANGFUSE_SECRET_KEY"
          test -n "${LANGFUSE_HOST}" || missing="${missing} LANGFUSE_HOST"
          test -n "${OPENAI_API_KEY}" || missing="${missing} OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub configuration:$missing"
            echo "Add LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY under Settings → Secrets and variables → Actions → Secrets."
            echo "Add LANGFUSE_HOST under Settings → Secrets and variables → Actions → Variables (or add a repository secret named LANGFUSE_HOST)."
            exit 1
          fi
          LANGFUSE_HOST="$(printf '%s' "$LANGFUSE_HOST" | tr -d '\r\n' | sed 's/^["'\''"]//;s/["'\''"]$//')"
          case "$LANGFUSE_HOST" in
            LANGFUSE_HOST=*) LANGFUSE_HOST="${LANGFUSE_HOST#LANGFUSE_HOST=}" ;;
          esac
          case "$LANGFUSE_HOST" in
            http://*|https://*) ;;
            *)
              echo "LANGFUSE_HOST has no scheme; using http://${LANGFUSE_HOST}"
              LANGFUSE_HOST="http://${LANGFUSE_HOST}"
              ;;
          esac
          export LANGFUSE_HOST="${LANGFUSE_HOST%/}"
          if ! printf '%s' "$LANGFUSE_HOST" | grep -qE '^https?://[^/[:space:]]+'; then
            echo "::error::LANGFUSE_HOST must be a URL like http://localhost:3000 (no spaces, no .env prefix, no cloud typo languse)."
            exit 1
          fi
          echo "LANGFUSE_HOST is set (length ${#LANGFUSE_HOST} chars)."
          echo "LANGFUSE_HOST=${LANGFUSE_HOST}" >> "$GITHUB_ENV"

      - name: Run monitor (last 24 hours)
        run: uv run python -m monitoring.run --last-hours 24

      - name: Upload monitoring output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring
          path: |
            monitoring/history.jsonl
            monitoring/prevalence.svg
            monitoring/config.json
            monitoring/artifacts/
          if-no-files-found: warn
